<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .func_page{
            display:flex;
            justify-content: center;
            position:relative;
            top:100px;
        }
        .create
        {
            margin-top: 30px;
            display:flex;
            justify-content: center;
            position:relative;
            top:100px;    
        }

        
        #domain_list{
            list-style-type: none;
        }

        #domain_list li {
        border: 1px solid black;
        border-top: none;
        width: 300px; 
        margin: 5px 0px;
        padding: 8px 12px; 
        
        
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        }

        #search_item{
            width: 200px;
        }

        .split-container {
            display: flex;
            justify-content: center;
            gap: 40px; 
            width: 800px; 
        }

        .panel {
            background: #ffffff;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            flex: 1; 
        }

        .input-group {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
        }
        .input-group label {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .input-group input {
            padding: 6px;
            border: 1px solid #000;
        }

        #bill_list {
            list-style-type: none;
            padding: 0;
        }
        #bill_list li {
            padding: 6px 0;
            border-bottom: 1px dashed #ccc;
        }
    </style>
</head>
<body>
    <header>
        <div class="navbar">
            <div class="logo"> </div>
            <a href="dashboard.html" class="Dashboard">Dashboard</a>
            <a class="create_invoice">Create Invoice</a>
            <a href="inventory.html" class="inventory">Inventory</a>
            <a href="index.html" class="logout">Logout</a>
        </div>
    </header>


    <div class="create">
    <div class="split-container">
        
        <div class="panel left-panel">
            <h3>Customer Invoice Details</h3>
            <div class="input-group">
                <label>Customer Name:</label>
                <input type="text" id="cust_name" placeholder="Enter name...">
            </div>
            <div class="input-group">
                <label>Mobile Number:</label>
                <input type="text" id="cust_mobile" placeholder="Enter mobile number...">
            </div>

            <h4>Current Items Added:</h4>
            <ul id="bill_list">
                </ul>
        </div>

        <div class="panel right-panel">
            <h3>Search Inventory</h3>
            <input type="text" id="search_item" class="search_item" placeholder="Type item name...">

            <ul id="domain_list">
                </ul>
        </div>
        <a href="bill.html">bill</a>
    </div>
</div>



    <script>
        const search_item = document.getElementById('search_item');

// 1. Fixed camelCase on getItem
let currentUser = localStorage.getItem("currentUser");

// SAFETY NET: Kick them out if not logged in
if (!currentUser) {
    window.location.href = "login.html";
}

let inv_key = currentUser + "_inv";

// 2. SAFETY NET: Handle empty inventory gracefully
let raw_inv_data = localStorage.getItem(inv_key);
let inv_list = raw_inv_data ? JSON.parse(raw_inv_data) : {};

let itemArray = Object.keys(inv_list);

let activeInvoice = {
    customerName: "",
    customerMobile: "",
    purchasedItems: {} 
};

search_item.addEventListener('input', function() {
    let query = search_item.value.toLowerCase().trim();
    const domainListElement = document.getElementById('domain_list');
    
    // Clear the list every time the user types so it doesn't duplicate
    domainListElement.innerHTML = "";

    // If the search box is empty, don't show the whole inventory
    if (query === "") return;

    itemArray.forEach(function(productName) {
        let itemText = productName.toLowerCase();

        if (itemText.includes(query)) {
            let item_dummy = document.createElement("li");
            
            let text_span = document.createElement("span");
            text_span.textContent = `${productName} - Rs.${inv_list[productName]}`;

            let add_btn = document.createElement("span");
            add_btn.textContent = " [+]";
            add_btn.style.cursor = "pointer";
            add_btn.style.fontWeight = "bold";
            add_btn.style.color = "green"; // Added a little color to make it look like a button

            // The click event when they add an item to the bill
            add_btn.addEventListener('click', function() {
                let currentName = document.getElementById("cust_name").value.trim();
                let currentMobile = document.getElementById("cust_mobile").value.trim();

                if (!currentName || !currentMobile) {
                    alert("Please enter Customer Name and Mobile Number first before adding items!");
                    return; 
                }

                activeInvoice.customerName = currentName;
                activeInvoice.customerMobile = currentMobile;

                localStorage.setItem("currentCust", currentName);
                localStorage.setItem("cust_no", currentMobile);

                // Add item to the live object
                activeInvoice.purchasedItems[productName] = inv_list[productName];

                // 3. FIXED SAVE LOGIC: Stringify and save to Local Storage immediately!
                let cust_key = currentName + "_inv";
                localStorage.setItem(cust_key, JSON.stringify(activeInvoice.purchasedItems));

                updateInvoiceDisplay();
            });

            item_dummy.append(text_span);
            item_dummy.append(add_btn);
            domainListElement.append(item_dummy);
        }
    });
});

function updateInvoiceDisplay() {
    let billListElement = document.getElementById("bill_list");
    billListElement.innerHTML = "";

    let billItems = Object.keys(activeInvoice.purchasedItems);

    billItems.forEach(function(itemName) {
        let billItemRow = document.createElement("li");
        let itemPrice = activeInvoice.purchasedItems[itemName];
        
        billItemRow.textContent = `${itemName} - Rs.${itemPrice}`;
        billListElement.append(billItemRow);
    });
}
    </script>
</body>
</html>
