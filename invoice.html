<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .func_page{
            display:flex;
            justify-content: center;
            position:relative;
            top:100px;
        }
        .create
        {
            margin-top: 30px;
            display:flex;
            justify-content: center;
            position:relative;
            top:100px;    
        }

        
        #domain_list{
            list-style-type: none;
        }

        #domain_list li{
            border:1px solid black;
            border-top: none;
            width: 200px;
            margin: 5px 0px 5px 0px;
            text-align: center;
        }

        #search_item{
            width: 200px;
        }
    </style>
</head>
<body>
    <header>
        <div class="navbar">
            <div class="logo"> </div>
            <a href="dashboard.html" class="Dashboard">Dashboard</a>
            <a class="create_invoice">Create Invoice</a>
            <a href="inventory.html" class="inventory">Inventory</a>
            <a href="index.html" class="logout">Logout</a>
        </div>
    </header>


    <div class="func_page">
                <p>Search the item to be added in the inventory !!!</p>
    </div>
    <div class="create">
        <div>
            <input type="text" id="search_item" class="search_item">

            <ul id="domain_list">
                <li>Web Development</li>
                <li>App Development</li>
                <li>Artificial Intelligence</li>
                <li>Machine Learning</li>
                <li>Computer Vision</li>
                <li>Cloud Computing</li>
                <li>Cyber Security</li>
            </ul>


        </div>
        


    </div>



    <script>
        const search_item = document.getElementById('search_item');

        const listitems = document.querySelectorAll('#domain_list li')

        search_item.addEventListener('input',function(){

            let query = search_item.value.toLowerCase().trim();

            listitems.forEach(function(item){
                let itemText = item.innerText.toLowerCase();

                if (itemText.includes(query))
            {
                item.style.display = "block";

            }
            else{
                item.style.display = "none";
            }
            })
        })
    </script>
</body>
</html>
